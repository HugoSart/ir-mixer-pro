[package]
name = "ir-mixer-pro"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
egui.workspace = true
egui_extras.workspace = true
ir-app = { path = "crates/ir-app" }
ir-core = { path = "crates/ir-core" }
ir-dsp = { path = "crates/ir-dsp" }
ir-native = { path = "crates/ir-native" }
ir-ui = { path = "crates/ir-ui" }
nice-plug-egui.workspace = true

[build-dependencies]
image.workspace = true

[workspace]
members = ["crates/ir-app", "crates/ir-core", "crates/ir-dsp", "crates/ir-native", "crates/ir-ui", "tools/ui-gallery"]
resolver = "3"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[workspace.dependencies]
egui = { version = "=0.36.2", default-features = false, features = ["bytemuck"] }
egui_extras = { version = "=0.36.2", default-features = false, features = ["image", "svg"] }
egui-lucide = "=0.1.0"
image = { version = "0.25.6", default-features = false, features = ["png"] }
raw-window-handle = "0.6.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
nice-plug-egui = "=0.5.0"
egui_kittest = { version = "=0.36.2", features = ["snapshot", "wgpu"] }
serde = { version = "1.0", features = ["derive"] }
hound = "3.5.1"
rustfft = "6.4.1"
thiserror = "2.0"
cpal = "0.15.3"
crossbeam-channel = "0.5.15"
rfd = "0.15.4"
rtrb = "0.3.2"
serde_json = "1.0"
