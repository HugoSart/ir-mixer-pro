[package]
name = "ir-mixer-pro"
version = "0.1.0"
edition = "2024"

[dependencies]
egui.workspace = true
egui_extras.workspace = true
ir-app = { path = "crates/ir-app" }
ir-ui = { path = "crates/ir-ui" }
nice-plug-egui.workspace = true

[workspace]
members = ["crates/ir-app", "crates/ir-ui", "tools/ui-gallery"]
resolver = "3"

[workspace.dependencies]
egui = { version = "=0.36.2", default-features = false, features = ["bytemuck"] }
egui_extras = { version = "=0.36.2", default-features = false, features = ["svg"] }
egui-lucide = "=0.1.0"
nice-plug-egui = "=0.5.0"
egui_kittest = { version = "=0.36.2", features = ["snapshot", "wgpu"] }
serde = { version = "1.0", features = ["derive"] }
